services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./apps/secrets:/app/apps/secrets:ro
      - ./gen-lang-client-0547522732-410672fac05f.json:/app/gen-lang-client-0547522732-410672fac05f.json:ro
    environment:
      TEXT_SEARCH_BACKEND: elasticsearch
      CLIP_EMBEDDING_BASE_URL: http://host.docker.internal:8001/v1
      MILVUS_CONNECT_TIMEOUT: "3.0"
      # SigLIP2's remote Zilliz collection can exceed the default 12 seconds
      # during a cold or large temporal retrieval; retain a bounded deadline.
      MILVUS_SEARCH_TIMEOUT: "30.0"
      # Apply Alembic migrations at startup so DRES receipt storage is present
      # before the web UI can submit an answer.
      SKIP_DB_INIT: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  esdata:
