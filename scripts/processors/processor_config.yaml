run:
  gcs_prefix: processed/keyframes
  shot_segments: ""
  batch_size: 8
  download_workers: 8
  gcs_timeout: 20
  max_frames: 0
  video_ids: []
  annotations_jsonl: data/processor_annotations_audit.jsonl
  log_file: scripts/processors/processor.log
  continue_on_batch_error: true

dataset:
  code: aic-2026
  name: aic-2026
  version: v1

sinks:
  write_pg: true
  write_milvus: true
  write_elasticsearch: true
  postgres_disable_prepared_statements: true
  fail_on_sink_error: false
  elasticsearch_request_timeout: 2
  elasticsearch_max_retries: 0
  elasticsearch_probe_timeout: 1
  elasticsearch_disable_after_error: true
  milvus_collection: keyframe_embeddings
  elasticsearch_index: keyframe_annotations
  model_version: openclip-vit-b-32-laion2b_s34b_b79k

models:
  cache_dir: "%USERPROFILE%/.cache/multimodal-retrieval/processor-cache"
  device: auto
  enable_tf32: true

  embedding:
    enabled: true
    provider: openclip
    model_name: ViT-B-32
    pretrained: laion2b_s34b_b79k
    batch_size: 64
    precision: fp16
    l2_normalize: true

  caption:
    enabled: false
    provider: blip
    model_class: BlipForConditionalGeneration
    model_name: Salesforce/blip-image-captioning-base
    batch_size: 4
    dtype: fp16
    low_cpu_mem_usage: true
    device_map: ""
    max_gpu_memory: ""
    max_cpu_memory: ""
    offload_folder: ""
    prompt: a photo of
    generation:
      max_new_tokens: 40
      min_new_tokens: 5
      num_beams: 1
      repetition_penalty: 1.2
      length_penalty: 1.1

  ocr:
    enabled: false
    provider: vietocr
    recognizer_model: vgg_seq2seq
    recognizer_weights_url: https://vocr.vn/data/vietocr/vgg_seq2seq.pth
    recognizer_weights_path: "%USERPROFILE%/.cache/multimodal-retrieval/processor-cache/vietocr/vgg_seq2seq.pth"
    detector_model: PP-OCRv5_mobile_det
    detector_limit_side_len: 960
    detector_limit_type: max
    line_y_threshold: 35
    line_x_gap_threshold: 180
    crop_padding: 12
    recognition_batch_size: 1

  objects:
    enabled: true
    provider: yolo
    model_name: yolo12n.pt
    image_size: 640
    batch_size: 8
    confidence: 0.25

profiles:
  smoke:
    run:
      batch_size: 4
      max_frames: 8
    models:
      caption:
        enabled: false
      ocr:
        enabled: false
      objects:
        enabled: true
        model_name: yolo12n.pt

  embedding_only:
    models:
      caption:
        enabled: false
      ocr:
        enabled: false
      objects:
        enabled: false

  zilliz_embedding_only:
    run:
      batch_size: 128
      download_workers: 10
      gcs_timeout: 60
    sinks:
      write_pg: false
      write_milvus: true
      write_elasticsearch: false
      fail_on_sink_error: true
      milvus_collection: keyframe_embeddings
    models:
      embedding:
        batch_size: 128
        precision: fp16
      caption:
        enabled: false
      ocr:
        enabled: false
      objects:
        enabled: false

  full:
    run:
      batch_size: 16
    models:
      caption:
        enabled: true
      ocr:
        enabled: true
      objects:
        enabled: true

  full_blip2:
    run:
      batch_size: 8
    models:
      caption:
        enabled: true
        provider: blip2
        model_class: Blip2ForConditionalGeneration
        model_name: Salesforce/blip2-opt-2.7b
        batch_size: 1
        dtype: fp16
        low_cpu_mem_usage: true
        device_map: auto
        max_gpu_memory: 6GiB
        max_cpu_memory: 10GiB
        offload_folder: "%USERPROFILE%/.cache/multimodal-retrieval/processor-cache/blip2-offload"
        generation:
          max_new_tokens: 80
          min_new_tokens: 10
          num_beams: 1
          repetition_penalty: 1.2
          length_penalty: 1.1
      ocr:
        enabled: true
      objects:
        enabled: true
