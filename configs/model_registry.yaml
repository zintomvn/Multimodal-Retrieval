embedders:
  clip_mock:
    task: multimodal_embedding
    provider: mock
    dim: 512
    enabled: false
    description: "Deterministic mock embedder for local development."
  openai_embedding:
    task: multimodal_embedding
    provider: openai_compatible
    base_url: http://localhost:8002/v1
    model: ViT-B-32-laion2b_s34b_b79k
    openclip_model: ViT-B-32
    openclip_pretrained: laion2b_s34b_b79k
    openclip_device: auto
    openclip_max_batch: 8
    dim: 512
    l2_normalize: true
    enabled: true
    description: "Must match demo/features/vit-ViT-B-32-laion2b_s34b_b79k embedding space."
  pe_core_bigg:
    task: multimodal_embedding
    provider: huggingface
    checkpoint_uri: models/pe-core-bigg
    device: cuda:0
    dtype: fp16
    batch_size: 16
    enabled: false
    description: "Place PE/OpenCLIP-style checkpoint here when available."
  beit3:
    task: multimodal_embedding
    provider: huggingface
    checkpoint_uri: models/beit3
    device: cuda:0
    dtype: fp16
    batch_size: 16
    enabled: false

ocr:
  mock_ocr:
    task: ocr
    provider: mock
    enabled: true
  paddle_vietocr:
    task: ocr
    provider: local
    checkpoint_uri: models/paddle-vietocr
    device: cuda:0
    enabled: false

asr:
  mock_asr:
    task: asr
    provider: mock
    enabled: true
  whisperx:
    task: asr
    provider: huggingface
    checkpoint_uri: models/whisperx
    device: cuda:0
    enabled: false

vision_language:
  mock_vlm:
    task: visual_qa
    provider: mock
    enabled: true
  qwen2_5_vl:
    task: visual_qa
    provider: openai_compatible
    base_url: http://localhost:8001/v1
    model: qwen2.5-vl-7b-instruct
    enabled: false

llm:
  mock_query_expander:
    task: query_expansion
    provider: mock
    enabled: true
  local_qwen:
    task: query_expansion
    provider: openai_compatible
    base_url: http://localhost:8001/v1
    model: qwen2.5-7b-instruct
    enabled: false
