competition_default:
  semantic_weight: 0.6
  metadata_weight: 0.3
  temporal_weight: 0.05
  user_boost_weight: 0.05
  rrf:
    enabled: true
    k: 60
  visual_rrf:
    enabled: true
    k: 60
  visual_models:
    clip_global:
      model_key: clip_vith14_quickgelu_dfn5b_v2
      collection: keyframe_embeddings_clip_vith14_quickgelu_dfn5b_v2
      weight: 1.0
      enabled: true
    siglip2_fine_grained:
      model_key: siglip2_so400m16_384_webli_openclip_1152_v1
      collection: keyframe_embeddings_siglip2_so400m16_384_webli_openclip_1152_v1
      weight: 1.0
      enabled: false
  query_expansion:
    enabled_default: true
    max_variants: 5
  result_diversification:
    enabled: true
    max_frames_per_video: 1
    min_frame_gap_ms: 10000
    min_frame_gap: 300
    candidate_pool_multiplier: 20
    min_candidate_pool: 500
    max_candidate_pool: 1000
  milvus:
    collection: keyframe_embeddings_clip_vith14_quickgelu_dfn5b_v2
    model_key: clip_vith14_quickgelu_dfn5b_v2
    weight: 1.0
    top_k_per_model: 100
    final_top_k: 50
  metadata:
    ocr_boost: 3.0
    asr_boost: 2.5
    object_boost: 1.8
    caption_boost: 5.0
    text_source_weights:
      asr: 0.35
      caption: 0.50
      ocr: 0.15
  reranking:
    enabled: false
    top_k: 50
    blend: 0.35
    cross_encoder_weight: 0.8
    mllm_weight: 0.2
    mllm:
      enabled: false
      top_k: 8
  temporal:
    delta_t_max_ms: 180000
    min_match_ratio: 0.50
    per_query_video_limit: 24
    prefer_full_sequences: true
    compactness_weight: 0.35
    gap_penalty: 0.20
    per_video_sequence_limit: 4
    # NMS happens after multiperspective fusion; these retain a deep event pool
    # before sequence construction and diversify the final KIS presentation.
    event_nms_window_ms: 1500
    event_nms_per_video_limit: 24
    anchor_nms_window_ms: 1500
    sequence_nms_window_ms: 3000
    max_sequences_per_video: 1
    min_representative_gap_ms: 10000
  dev_first:
    diagnostic_probe: {enabled: true, top_k_per_event: 40, planner_weight: 0.55, probe_weight: 0.45}
    # One bilingual re-probe of the selected diagnostic event restores
    # SigLIP2 recall without multiplying every global event search.
    bilingual_diagnostic_reprobe: true
    # DEV's global pass reserves distinct videos for each important event; the
    # second Milvus pass is restricted to this small, diverse set.
    candidate_video_limit: 32
    # Expand only when a caller asks for a large top-k.  The pool contains
    # distinct videos, so one representative sequence/video can still return
    # more candidates than the requested top-k without a broad local scan.
    # For top_k=5 this keeps 85 distinct videos. A controlled benchmark at the
    # 160-video cap did not improve recall but increased latency substantially.
    output_video_buffer: 80
    max_candidate_video_limit: 160
    # Bound multiperspective work in both the global diagnostic and the local
    # filtered pass: two English CLIP/caption views plus one Vietnamese
    # SigLIP2 semantic view when the bilingual prompt provides it.
    max_semantic_views_per_event: 2
    max_text_views_per_event: 2
    min_candidate_videos: 8
    diverse_videos_per_event: 2
    video_scoring: {best_weight: 0.55, top_m_mean_weight: 0.30, view_agreement_weight: 0.15, top_m: 3, diagnostic_weight: 0.55, cross_event_weight: 0.35, coverage_weight: 0.10}
    event_retrieval: {initial_top_k: 200, max_top_k: 400, min_candidates_per_event: 24}
    event_nms_window_ms: 2500
    per_video_candidate_min_gap_ms: 1500
    per_event_per_video_limit: 12
    sequence_beam_width: 200
    # DEV-first ranks videos before choosing a representative frame.  Keep one
    # well-separated sequence per video in the interactive result list so a
    # single shot cannot occupy neighbouring cards.
    max_sequences_per_video: 1
    sequence_nms_window_ms: 10000
    min_match_ratio: 0.50
    # AutoShot may omit one of several planned events; retain the two-event
    # noise guard without forcing three matches for a five-event narrative.
    max_default_min_match: 2
    temporal_gap_classes:
      short: {max_gap_ms: 45000}
      medium: {max_gap_ms: 120000}
      loose: {max_gap_ms: 300000}
      unknown: {max_gap_ms: null}
    score_calibration: {relative_weight: 0.60, absolute_weight: 0.20, hybrid_weight: 0.20}
    sequence_scoring: {evidence_weight: 0.55, coverage_weight: 0.20, strong_coverage_weight: 0.10, diagnostic_weight: 0.05, missing_penalty_weight: 0.10, temporal_gap_penalty_weight: 0.10}
    temporal_gap_reference_ms: 45000
    strong_match_threshold: 0.55
    representative_frame_policy: highest_confidence_matched_event
    dynamic_sampling: {enabled: true}

